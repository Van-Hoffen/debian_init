# ══════════════════════════════════════════════════════════════════
# ~/.tmux.conf
# ══════════════════════════════════════════════════════════════════

# ── Основные настройки ────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # True color
set -g history-limit 10000                        # История скролла
set -g base-index 1                               # Окна с 1, не с 0
set -g pane-base-index 1                          # Панели с 1
set -g renumber-windows on                        # Перенумеровать окна после закрытия
set -g escape-time 10                             # Убрать задержку ESC
set -g focus-events on                            # Поддержка focus events
set -g mouse on                                   # Мышь: скролл, клик по панелям

# ── Префикс: C-b → C-a ────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── Перезагрузка конфига: C-a r ───────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "✓ Конфиг перезагружен"

# ── Разделение панелей ────────────────────────────────────────────
bind = split-window -h -c "#{pane_current_path}"  # Вертикальное | (в текущей папке)
bind - split-window -v -c "#{pane_current_path}"  # Горизонтальное - (в текущей папке)
unbind '"'
unbind %

# ── Навигация между панелями (vim-style) ─────────────────────────
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# ── Изменение размера панелей (shift + vim-style) ─────────────────
#bind -r H resize-pane -L 5
#bind -r J resize-pane -D 5
#bind -r K resize-pane -U 5
#bind -r L resize-pane -R 5

# ── Быстрое переключение окон ─────────────────────────────────────
# ── Alt+1-9: перейти на окно или создать новое ────────────────────
bind -n M-1 run-shell "tmux select-window -t 1 2>/dev/null || tmux new-window -t 1"
bind -n M-2 run-shell "tmux select-window -t 2 2>/dev/null || tmux new-window -t 2"
bind -n M-3 run-shell "tmux select-window -t 3 2>/dev/null || tmux new-window -t 3"
bind -n M-4 run-shell "tmux select-window -t 4 2>/dev/null || tmux new-window -t 4"
bind -n M-5 run-shell "tmux select-window -t 5 2>/dev/null || tmux new-window -t 5"
bind -n M-6 run-shell "tmux select-window -t 6 2>/dev/null || tmux new-window -t 6"
bind -n M-7 run-shell "tmux select-window -t 7 2>/dev/null || tmux new-window -t 7"
bind -n M-8 run-shell "tmux select-window -t 8 2>/dev/null || tmux new-window -t 8"
bind -n M-9 run-shell "tmux select-window -t 9 2>/dev/null || tmux new-window -t 9"
# ── Alt+q: закрыть текущее окно с подтверждением ─────────────────
bind -n M-q confirm-before -p "Закрыть окно #W? (y/n)" kill-window
# ── Alt+e: закрыть текущую панель без подтверждения ──────────────
bind -n M-e kill-pane

# ── Синхронизация панелей (вводить команду во все сразу) ──────────
bind S setw synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# ── Новое окно в текущей папке C-a c ──────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ── Копирование в системный буфер (vi-mode) ───────────────────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Статусная строка ──────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1c1b19 fg=#cdccca"

set -g status-left-length 40
set -g status-left "#[bg=#01696f,fg=#f9f8f5,bold] #S #[default] "

set -g status-right-length 80
set -g status-right "#[fg=#7a7974] #{?synchronize-panes,#[fg=#da7101] SYNC ,}#[fg=#7a7974]%H:%M  %d.%m.%Y "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#01696f,fg=#f9f8f5,bold] #I:#W "

set -g pane-border-style        "fg=#393836"
set -g pane-active-border-style "fg=#01696f"

set -g message-style "bg=#01696f fg=#f9f8f5"


# ══════════════════════════════════════════════════════════════════
# C-a h — всплывающее окно с hotkeys
# ══════════════════════════════════════════════════════════════════
bind h display-popup -E -w 64 -h 32 -T " Hotkeys (C-a ?) " "cat << 'EOF'
 ПРЕФИКС(Prf): Ctrl+a
 ── Панели ───────────────────────────────────────
  Prf+=      Разделить вертикально (|)
  Prf+-      Разделить горизонтально (-)
  Prf+x      Закрыть панель без подтверждения
  Alt+e      Закрыть панель без подтверждения
  Prf+z      Развернуть/свернуть панель на весь экран
  Prf+S      Синхронизация ввода во все панели
 ── Окна ─────────────────────────────────────────
  Prf+c      Новое окно
  Prf+,      Переименовать окно
  Alt+1-8    Создать окно по номеру
  Alt+1-8    Переключиться на окно по номеру
  Alt+q      Закрыть окно(с подтверждением)
 ── Сессии ───────────────────────────────────────
  Prf+d      Отключиться (сессия остаётся)
  Prf+s      Список сессий
  Prf+\$     Переименовать сессию
 ── Прочее ───────────────────────────────────────
  Prf+r      Перезагрузить конфиг tmux
  Prf+[      Режим копирования (vi: v выбор, y копировать)
  Prf+]      Вставить из буфера
  Prf+t      Показать часы
  Prf+?      Полный список всех hotkeys tmux
 ── Мышь ─────────────────────────────────────────
  Клик       Выбор панели/окна
  Скролл     Прокрутка истории
 ─────────────────────────────────────────────────
            Закрыть: q или Esc
EOF
read -r -s -n1 key"
###################################################
### DESIGN CHANGES ################################
###################################################

# Отключить все звуки и уведомления
setw -g monitor-activity on 
set -g visual-activity on  # Показывает сообщение в статусной строке когда в фоновом окне появляется активность (новый вывод текста). Работает только если включён monitor-activity.
set -g visual-bell on
set -g visual-silence off
setw -g monitor-silence 30   # уведомить если тихо 30 секунд

set -g bell-action other
# none	Игнорировать bell полностью
# any	Реагировать на bell из любого окна
# current	Реагировать только из активного окна
# other	Реагировать только из фоновых окон

# ── Режим копирования ─────────────────────────────────────────────
setw -g clock-mode-colour colour66
setw -g mode-style 'fg=colour255 bg=colour238 bold'

# ── Границы панелей ───────────────────────────────────────────────
set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour66'

# ── Имя окна: bash если shell, иначе название программы ──────────
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},bash,#{pane_title}}'

# ══════════════════════════════════════════════════════════════════
# ПАНЕЛЬ 1 (ВЕРХНЯЯ)  status-format[1]
# Сессия + список окон
# ══════════════════════════════════════════════════════════════════
set -g status 2
set -g status-position bottom
set -g status-interval 2

# Стиль строки окон
set -g status-style 'bg=colour234 fg=colour243'

# Левая часть — имя сессии (root=красный, user=бирюзовый)
set -g status-left-length 30
set -g status-left '#{?#{==:#{client_user},root},#[bg=colour160 fg=colour255 bold] ROOT:#S #[bg=colour234 fg=colour160]▓▒░,#[bg=colour66 fg=colour234 bold] #S #[bg=colour234 fg=colour66]▓▒░}#[default] '

# Правая часть верхней строки — ПУСТО
set -g status-right ''
set -g status-right-length 0

# ── Окна в статусной строке ───────────────────────────────────────
# Неактивное окно
setw -g window-status-style         'fg=colour243 bg=colour234'
# Неактивное окно — проверяем есть ли root в заголовке панели
setw -g window-status-format \
  '#{?#{m:*root*,#{pane_title}},#[fg=colour160 bold],#[fg=colour243 bg=colour234]} #I:#W#[fg=colour238]#F #[default]'
# Активное окно — бирюзовый акцент
setw -g window-status-current-style 'fg=colour234 bg=colour66 bold'
# Активное окно — проверяем есть ли root в заголовке панели
setw -g window-status-current-format \
  '#{?#{m:*root*,#{pane_title}},#[bg=colour160 fg=colour255 bold],#[bg=colour66 fg=colour234 bold]} #I:#W#[fg=colour234]#F #[default]'

# Окно с активностью — оранжевый
setw -g window-status-activity-style 'fg=colour214 bg=colour234'

# Окно с уведомлением (bell)
setw -g window-status-bell-style    'fg=colour255 bg=colour160 bold'

# ── Сообщения (командная строка tmux) ────────────────────────────
set -g message-style          'fg=colour255 bg=colour238 bold'
set -g message-command-style  'fg=colour214 bg=colour238'

# Автоматическое имя окна = то что программа передаёт в заголовок терминала
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{pane_current_command},#{pane_title}}'
# Ограничить длину чтобы не вылезало за строку
set -g status-right-length 90

# ══════════════════════════════════════════════════════════════════
# ПАНЕЛЬ 2 (НИЖНЯЯ) — status-format[1]
# FQDN │ путь  │ ⚡SYNC       ~       CPU: RAM: │ load │ дата время
# Для работы CPU должен быть установлен - apt-get install procps -y
# ══════════════════════════════════════════════════════════════════
set -g status-format[1] '\
#[bg=colour237 fg=colour250 bold] #H \
#[fg=colour244 nobold]│\
#[fg=colour243 nobold] #{pane_current_path}\
#{?synchronize-panes, #[fg=colour214 bold]⚡SYNC#[fg=colour243 nobold],} \
#[align=right bg=colour237]\
#[fg=colour243]CPU: #(vmstat 1 2 | awk "END{printf \"%d%%\", 100-\$15}") \
RAM: #(free -m | awk "/^Mem/{printf \"%dMB/%dMB\",\$3,\$2}") \
#[fg=colour244]│\
#[fg=colour243] #(cut -d" " -f1-3 /proc/loadavg) \
#[fg=colour244] │ \
#[fg=colour243]─ %d.%m.%Y \
#[fg=colour244]│\
#[fg=colour255 bold] %H:%M \
#[bg=colour237] '
